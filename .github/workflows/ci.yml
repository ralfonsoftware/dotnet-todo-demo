name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Cancel superseded PR runs; never cancel a verification run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TodoApi.slnx

      - name: Build
        run: dotnet build TodoApi.slnx --no-restore

      - name: Test
        run: >-
          dotnet test TodoApi.slnx --no-build
          --results-directory TestResults
          --report-xunit-trx

      - name: Check formatting
        run: dotnet format TodoApi.slnx --no-restore --verify-no-changes

      # Fork and Dependabot PRs get a read-only token, so the check run cannot be created.
      - name: Publish test results
        if: >-
          ${{ !cancelled() && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')) }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: 'true'
          fail-on-empty: 'true'
          # Publish a check run on the commit; the job summary is written below.
          use-actions-summary: 'false'

      - name: Upload test results
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
          if-no-files-found: warn

      - name: Write job summary
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: python3 {0}
        run: |
          import glob, os
          import xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          total = passed = failed = skipped = 0
          files = glob.glob("TestResults/*.trx")
          for path in files:
              counters = ET.parse(path).getroot().find("t:ResultSummary/t:Counters", ns)
              if counters is None:
                  continue
              n = lambda key: int(counters.get(key, 0))
              total += n("total")
              passed += n("passed")
              failed += n("failed") + n("error") + n("timeout") + n("aborted")
              skipped += n("notExecuted")

          lines = ["## Test results", ""]
          if not files:
              lines.append("No .trx files found.")
          else:
              lines += [
                  "| Total | Passed | Failed | Skipped |",
                  "| ---: | ---: | ---: | ---: |",
                  f"| {total} | {passed} | {failed} | {skipped} |",
              ]
          url = os.environ.get("ARTIFACT_URL")
          if url:
              lines += ["", f"[Download test-results artifact]({url})"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
