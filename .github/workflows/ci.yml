name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TodoApi.slnx

      - name: Build
        run: dotnet build TodoApi.slnx --no-restore

      - name: Test
        run: >-
          dotnet test TodoApi.slnx --no-build
          --results-directory TestResults
          --report-xunit-trx

      - name: Check formatting
        run: dotnet format TodoApi.slnx --no-restore --verify-no-changes

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
